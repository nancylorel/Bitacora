<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora de Casos — Vimenti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F4F6F3;
    --paper:#FFFFFF;
    --ink:#232B26;
    --ink-soft:#5B6660;
    --ink-faint:#8A9089;
    --line:#E1E6DE;
    --line-soft:#EDF0EA;
    --accent:#3D6B5C;
    --accent-dark:#2C4F44;
    --accent-soft:#E4EEE9;
    --gold:#B9862E;
    --gold-soft:#F6EDDA;
    --plum:#7A5980;
    --plum-soft:#F0E8F1;
    --blue:#4C6FA8;
    --blue-soft:#E9EEF6;
    --teal:#3F8577;
    --teal-soft:#E6F1EE;
    --gray:#7C8279;
    --gray-soft:#EEF0EC;
    --alert:#AF4632;
    --alert-soft:#F6E7E3;
    --radius:14px;
    --shadow:0 1px 2px rgba(35,43,38,0.06), 0 8px 24px -12px rgba(35,43,38,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  .app-shell{max-width:1180px;margin:0 auto;padding:20px 20px 60px;}

  /* ---- Login screen ---- */
  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .login-card{
    width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 28px;
  }
  .login-card h1{font-size:22px;color:var(--accent-dark);margin-bottom:4px;}
  .login-card .subtitle{font-size:12.5px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.03em;margin-bottom:22px;display:block;}
  .login-field{margin-bottom:14px;}
  .login-field label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-dark);margin-bottom:5px;}
  .login-field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;outline:none;}
  .login-field input:focus{border-color:var(--accent);}
  .login-submit{
    width:100%;background:var(--accent);color:#fff;border:none;border-radius:9px;
    padding:11px;font-size:14px;font-weight:600;margin-top:6px;
  }
  .login-submit:hover{background:var(--accent-dark);}
  .login-submit:disabled{opacity:.6;cursor:default;}
  .login-toggle{
    margin-top:16px;text-align:center;font-size:12.5px;color:var(--ink-soft);
  }
  .login-toggle button{background:none;border:none;color:var(--accent);font-weight:600;text-decoration:underline;font-size:12.5px;padding:0;}
  .login-msg{font-size:12.5px;margin-top:10px;padding:9px 11px;border-radius:8px;line-height:1.5;}
  .login-msg.error{background:var(--alert-soft);color:var(--alert);}
  .login-msg.ok{background:var(--accent-soft);color:var(--accent-dark);}

  /* ---- Topbar ---- */
  .topbar{
    display:flex;align-items:flex-end;justify-content:space-between;
    padding:6px 4px 22px;
    border-bottom:1px solid var(--line);
    margin-bottom:22px;
    gap:16px;flex-wrap:wrap;
  }
  .topbar .title-block{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .topbar h1{font-size:26px;font-weight:600;color:var(--accent-dark);letter-spacing:-0.01em;}
  .topbar .subtitle{font-size:13px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;text-transform:uppercase;}
  .topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .topbar .stat{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
    background:var(--paper);border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;white-space:nowrap;
  }
  .user-email{font-size:11.5px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;}

  /* ---- Layout ---- */
  .layout{display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start;}
  @media(max-width:820px){
    .layout{grid-template-columns:1fr;}
    .app-shell.detail-open .sidebar{display:none;}
    .app-shell:not(.detail-open) .main-panel{display:none;}
  }
  .back-link{
    display:none;align-items:center;gap:6px;
    color:var(--accent);font-size:13px;font-weight:600;
    background:none;border:none;padding:0 0 14px;
  }
  @media(max-width:820px){
    .app-shell.detail-open .back-link{display:inline-flex;}
  }

  /* ---- Sidebar ---- */
  .sidebar{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .sidebar-head{padding:16px 16px 12px;border-bottom:1px solid var(--line-soft);}
  .search-input{
    width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;
    font-size:13.5px;color:var(--ink);background:var(--bg);outline:none;
  }
  .search-input:focus{border-color:var(--accent);background:var(--paper);}
  .add-student-btn{
    width:100%;margin-top:10px;
    background:var(--accent);color:#fff;border:none;border-radius:9px;
    padding:9px 12px;font-size:13.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .add-student-btn:hover{background:var(--accent-dark);}

  .student-list{max-height:640px;overflow-y:auto;padding:8px;}
  .student-tab{
    position:relative;
    display:flex;flex-direction:column;gap:3px;
    padding:11px 12px 11px 16px;margin-bottom:6px;
    border:1px solid var(--line-soft);border-radius:10px;
    background:var(--paper);
    cursor:pointer;transition:background .12s, border-color .12s;
  }
  .student-tab::before{
    content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:3px;
    background:var(--line);
  }
  .student-tab.priority::before{background:var(--alert);}
  .student-tab:hover{background:var(--accent-soft);}
  .student-tab.active{background:var(--accent-soft);border-color:var(--accent);}
  .student-tab .row1{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .student-tab .name{font-weight:600;font-size:14px;color:var(--ink);}
  .student-tab .meta{font-size:11.5px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;}
  .student-tab .diag{font-size:12px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .student-tab .count-badge{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--accent-dark);
    background:var(--accent-soft);border-radius:999px;padding:2px 7px;flex-shrink:0;
  }
  .empty-list{padding:26px 16px;text-align:center;color:var(--ink-faint);font-size:13px;}

  /* ---- Add / Edit student form ---- */
  .student-form{padding:14px 16px;border-bottom:1px solid var(--line-soft);background:var(--accent-soft);}
  .field-label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-dark);margin:10px 0 4px;}
  .field-label:first-child{margin-top:0;}
  .field-input, .field-select, .field-textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    font-size:13.5px;background:var(--paper);color:var(--ink);outline:none;
  }
  .field-input:focus,.field-select:focus,.field-textarea:focus{border-color:var(--accent);}
  .field-textarea{resize:vertical;min-height:64px;line-height:1.4;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .form-actions{display:flex;gap:8px;margin-top:14px;}
  .btn{border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--gray-soft);}
  .btn-danger{background:var(--alert);color:#fff;}
  .btn-danger:hover{background:#8f3826;}
  .btn-small{padding:5px 10px;font-size:12px;border-radius:7px;}
  .btn:disabled{opacity:.6;cursor:default;}

  /* ---- Main panel ---- */
  .main-panel{min-height:400px;}
  .empty-state{
    background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius);
    padding:60px 30px;text-align:center;color:var(--ink-faint);
  }
  .empty-state h2{font-size:19px;color:var(--ink-soft);margin-bottom:8px;font-weight:500;}
  .empty-state p{font-size:13.5px;line-height:1.6;max-width:340px;margin:0 auto;}

  .profile-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px;}
  .profile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
  .profile-name{font-size:22px;font-weight:600;color:var(--accent-dark);}
  .profile-meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
  .meta-chip{
    font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--ink-soft);
    background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;
  }
  .profile-diag{margin-top:12px;font-size:13.5px;color:var(--ink-soft);line-height:1.55;}
  .profile-diag strong{color:var(--ink);}
  .profile-actions{display:flex;gap:8px;flex-shrink:0;}

  .section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px;}
  .section-head h3{font-size:15px;color:var(--ink);font-weight:600;}
  .filter-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    font-size:11.5px;font-family:'IBM Plex Mono',monospace;padding:4px 10px;border-radius:999px;
    border:1px solid var(--line);background:var(--paper);color:var(--ink-soft);
  }
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* ---- Entry form ---- */
  .entry-form{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px;}
  .entry-form h4{font-size:14px;font-weight:600;color:var(--accent-dark);margin-bottom:12px;}
  .priority-toggle{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--ink-soft);}
  .priority-toggle input{width:16px;height:16px;accent-color:var(--alert);}

  /* ---- Timeline / entry cards ---- */
  .timeline{display:flex;flex-direction:column;gap:10px;}
  .entry-card{
    position:relative;
    background:var(--paper);border:1px solid var(--line-soft);border-radius:10px;
    padding:14px 16px 14px 16px;border-left:4px solid var(--gray);
    box-shadow:0 1px 2px rgba(35,43,38,0.04);
  }
  .entry-card::after{
    content:"";position:absolute;top:0;right:0;width:14px;height:14px;
    background:linear-gradient(135deg, transparent 50%, var(--bg) 50%);
    border-bottom-left-radius:4px;
  }
  .entry-card.cat-academico{border-left-color:var(--blue);}
  .entry-card.cat-conducta{border-left-color:var(--gold);}
  .entry-card.cat-emocional{border-left-color:var(--plum);}
  .entry-card.cat-social{border-left-color:var(--teal);}
  .entry-card.cat-otro{border-left-color:var(--gray);}
  .entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .entry-tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .entry-date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-faint);}
  .entry-source{
    font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;
    padding:2px 8px;border-radius:999px;
  }
  .cat-academico .entry-source{background:var(--blue-soft);color:var(--blue);}
  .cat-conducta .entry-source{background:var(--gold-soft);color:var(--gold);}
  .cat-emocional .entry-source{background:var(--plum-soft);color:var(--plum);}
  .cat-social .entry-source{background:var(--teal-soft);color:var(--teal);}
  .cat-otro .entry-source{background:var(--gray-soft);color:var(--gray);}
  .priority-flag{
    font-size:10.5px;font-weight:700;color:var(--alert);background:var(--alert-soft);
    border-radius:999px;padding:2px 8px;text-transform:uppercase;letter-spacing:.03em;
  }
  .entry-text{margin-top:8px;font-size:13.5px;line-height:1.55;color:var(--ink);white-space:pre-wrap;}
  .entry-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .entry-category-label{font-size:11px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;}
  .entry-delete{background:none;border:none;color:var(--ink-faint);font-size:11.5px;padding:2px 4px;}
  .entry-delete:hover{color:var(--alert);}
  .confirm-row{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--ink-soft);}

  .empty-timeline{padding:30px;text-align:center;color:var(--ink-faint);font-size:13px;background:var(--paper);border:1px dashed var(--line);border-radius:12px;}

  .footer-note{margin-top:26px;text-align:center;font-size:11.5px;color:var(--ink-faint);line-height:1.6;}
  .loading{padding:80px 20px;text-align:center;color:var(--ink-faint);font-size:14px;}
</style>
</head>
<body>
<div id="root" class="loading">Cargando…</div>

<script>
(function(){

  // ==== CONFIGURACIÓN SUPABASE ====
  const SUPABASE_URL = 'https://xyzavxsjysghlxdxrbea.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh5emF2eHNqeXNnaGx4ZHhyYmVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDM2OTksImV4cCI6MjEwMjIxOTY5OX0.W5IhAZNSKd8TEhnb9BJ09G30V_aLY_SLII8PyYNyR5w';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CATEGORIES = [
    {id:'academico', label:'Académico'},
    {id:'conducta', label:'Conducta'},
    {id:'emocional', label:'Emocional'},
    {id:'social', label:'Social'},
    {id:'otro', label:'Otro'},
  ];
  const SOURCES = ['Mamá/Papá','Maestro/a','Observación propia','Otro personal escolar','Otro'];

  const SEED_STUDENTS = [
    {nombre:'Ainoah L. Báez Peñaloza', grado:'3'},
    {nombre:'Keenan L. Sánchez Morales', grado:'3'},
    {nombre:'Adrián Andrades', grado:'1'},
    {nombre:'Ginalee Rodríguez Calixto', grado:'4'},
    {nombre:'Jan J. Guzmán Pastrana', grado:'5'},
    {nombre:'Jeremiah Manuel Mulero Acevedo', grado:'5'},
    {nombre:'Dylan José González Quiles', grado:'6'},
    {nombre:'Dereck Janiel Sánchez Rosario', grado:'6'},
    {nombre:'Miguel E. Montañez Talavera', grado:'6'},
    {nombre:'Alan Obiel Hernández Arroyo', grado:'6'},
    {nombre:'Ekko Calliope Pecunia Camilo', grado:'6'},
    {nombre:'Ivanhiel Anibal Navarro Hernández', grado:'6'},
    {nombre:'Zulyannie Mulero Matías', grado:'6'},
    {nombre:'Edsel Kalel Guzmán Ríos', grado:'7'},
    {nombre:'Ivan Franquiz Schemety', grado:'7'},
    {nombre:'Jean Anthony Jiménez Fermant', grado:'7'},
    {nombre:'Juan Carlos Pastrana Rodríguez', grado:'7'},
    {nombre:'Acineve Torres Rivera', grado:'8'},
    {nombre:'Albert X. Colón Delgado', grado:'8'},
    {nombre:'Alyssa Montalvo Picón', grado:'8'},
    {nombre:'Ediel Disla', grado:'8'},
    {nombre:'Jeansiel D. Molina Santana', grado:'8'},
    {nombre:'Sabdiel Jaime González', grado:'8'},
    {nombre:'Steven Urbaez', grado:'8'},
    {nombre:'Ángel Y. Colón Verdejo', grado:'9'},
    {nombre:'Giomel Vecchioli Gómez', grado:'9'},
    {nombre:'Liam Birriel Lebrón', grado:'9'},
    {nombre:'Japhet Domenech Rolón', grado:'9'},
  ];

  let state = {
    session:null,
    authMode:'login',       // 'login' | 'signup'
    authLoading:false,
    authMsg:null,           // {type:'error'|'ok', text}

    loaded:false,
    students:[],
    entriesByStudent:{},
    selectedId:null,
    search:'',
    showAddStudent:false,
    editingStudent:null,
    showAddEntry:false,
    categoryFilter:'todas',
    confirmDeleteStudent:null,
    confirmDeleteEntry:null,
    busy:false,
  };

  function esc(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtDate(iso){
    if(!iso) return '';
    const [y,m,d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }
  function catLabel(id){ const c = CATEGORIES.find(c=>c.id===id); return c?c.label:'Otro'; }

  function studentEntries(id){
    return (state.entriesByStudent[id]||[]).slice().sort((a,b)=> b.fecha.localeCompare(a.fecha) || (b.created_at||'').localeCompare(a.created_at||''));
  }
  function lastUpdate(id){ const es = studentEntries(id); return es.length ? es[0].fecha : null; }
  function hasRecentPriority(id){ const es = studentEntries(id); return es.length>0 && es[0].prioridad; }
  function pendingSeedCount(){
    const existing = new Set(state.students.map(s=>s.nombre.trim().toLowerCase()));
    return SEED_STUDENTS.filter(s=>!existing.has(s.nombre.trim().toLowerCase())).length;
  }

  // ============ DATA LAYER (Supabase) ============
  async function loadAll(){
    state.loaded = false; render();
    const [{data:students, error:e1}, {data:entries, error:e2}] = await Promise.all([
      sb.from('students').select('*').order('nombre'),
      sb.from('entries').select('*'),
    ]);
    if(e1) console.error(e1);
    if(e2) console.error(e2);
    state.students = students || [];
    const grouped = {};
    (entries||[]).forEach(e=>{
      if(!grouped[e.student_id]) grouped[e.student_id] = [];
      grouped[e.student_id].push(e);
    });
    state.entriesByStudent = grouped;
    state.loaded = true;
    render();
  }

  async function addStudent(fields){
    const {data, error} = await sb.from('students').insert(fields).select().single();
    if(error){ console.error(error); return; }
    state.students.push(data);
    state.entriesByStudent[data.id] = [];
  }
  async function updateStudent(id, fields){
    const {data, error} = await sb.from('students').update(fields).eq('id', id).select().single();
    if(error){ console.error(error); return; }
    const i = state.students.findIndex(s=>s.id===id);
    if(i>-1) state.students[i] = data;
  }
  async function deleteStudentRow(id){
    const {error} = await sb.from('students').delete().eq('id', id);
    if(error){ console.error(error); return; }
    state.students = state.students.filter(s=>s.id!==id);
    delete state.entriesByStudent[id];
  }
  async function addEntry(studentId, fields){
    const {data, error} = await sb.from('entries').insert({...fields, student_id: studentId}).select().single();
    if(error){ console.error(error); return; }
    if(!state.entriesByStudent[studentId]) state.entriesByStudent[studentId] = [];
    state.entriesByStudent[studentId].push(data);
  }
  async function deleteEntryRow(studentId, entryId){
    const {error} = await sb.from('entries').delete().eq('id', entryId);
    if(error){ console.error(error); return; }
    state.entriesByStudent[studentId] = (state.entriesByStudent[studentId]||[]).filter(e=>e.id!==entryId);
  }

  // ============ EXPORT ============
  function buildExportText(){
    const lines = [];
    lines.push('BITÁCORA DE CASOS — ESCUELA VIMENTI');
    lines.push('Exportado: ' + new Date().toLocaleDateString('es-PR'));
    lines.push('='.repeat(50));
    const sorted = state.students.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
    sorted.forEach(s=>{
      lines.push('');
      lines.push(s.nombre.toUpperCase());
      lines.push(`Grado: ${s.grado||'—'}  |  Edad: ${s.edad||'—'}`);
      lines.push(`Diagnóstico: ${s.diagnostico||'—'}`);
      lines.push('-'.repeat(40));
      const entries = studentEntries(s.id);
      if(!entries.length){
        lines.push('  (sin entradas registradas)');
      } else {
        entries.forEach(e=>{
          lines.push(`  [${fmtDate(e.fecha)}] ${e.fuente} — ${catLabel(e.categoria)}${e.prioridad?' (PRIORIDAD ALTA)':''}`);
          lines.push(`    ${e.texto}`);
        });
      }
    });
    return lines.join('\n');
  }
  function downloadExport(){
    const text = buildExportText();
    const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'bitacora-vimenti-' + new Date().toISOString().slice(0,10) + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ============ RENDER ============
  function render(){
    const root = document.getElementById('root');
    if(!state.session){ renderAuth(root); return; }
    if(!state.loaded){ root.innerHTML = '<div class="loading">Cargando bitácora…</div>'; return; }

    const selected = state.students.find(s=>s.id===state.selectedId) || null;
    const shellClass = 'app-shell' + (selected ? ' detail-open' : '');

    root.outerHTML = `<div id="root" class="${shellClass}">
      <div class="topbar">
        <div class="title-block">
          <h1>Bitácora de Casos</h1>
          <span class="subtitle">Escuela Vimenti · Psicología Escolar</span>
        </div>
        <div class="topbar-right">
          <span class="user-email">${esc(state.session.user.email)}</span>
          <div class="stat">${state.students.length} estudiante${state.students.length===1?'':'s'}</div>
          <button class="btn btn-ghost btn-small" data-action="export-data">Exportar datos</button>
          <button class="btn btn-ghost btn-small" data-action="logout">Cerrar sesión</button>
        </div>
      </div>

      <div class="layout">
        ${renderSidebar()}
        <div class="main-panel">
          <button class="back-link" data-action="back">‹ Volver a la lista</button>
          ${selected ? renderProfile(selected) : renderEmptyState()}
        </div>
      </div>

      <div class="footer-note">Los datos se guardan en tu base de datos privada — solo tú, con tu contraseña, puedes verlos.</div>
    </div>`;

    attachHandlers();
  }

  function renderAuth(root){
    const m = state.authMsg;
    root.outerHTML = `<div id="root">
      <div class="login-wrap">
        <div class="login-card">
          <h1>Bitácora de Casos</h1>
          <span class="subtitle">Escuela Vimenti · Psicología Escolar</span>
          <form id="auth-form">
            <div class="login-field">
              <label>Correo electrónico</label>
              <input type="email" id="auth-email" required autocomplete="username">
            </div>
            <div class="login-field">
              <label>Contraseña</label>
              <input type="password" id="auth-password" required minlength="6" autocomplete="${state.authMode==='signup'?'new-password':'current-password'}">
            </div>
            <button class="login-submit" type="submit" ${state.authLoading?'disabled':''}>
              ${state.authLoading ? 'Un momento…' : (state.authMode==='signup' ? 'Crear cuenta' : 'Iniciar sesión')}
            </button>
          </form>
          ${m ? `<div class="login-msg ${m.type}">${esc(m.text)}</div>` : ''}
          <div class="login-toggle">
            ${state.authMode==='signup'
              ? `¿Ya tienes cuenta? <button data-action="switch-login">Iniciar sesión</button>`
              : `¿Primera vez aquí? <button data-action="switch-signup">Crear cuenta</button>`}
          </div>
        </div>
      </div>
    </div>`;

    document.getElementById('auth-form').addEventListener('submit', onAuthSubmit);
    document.getElementById('root').addEventListener('click', (ev)=>{
      const t = ev.target.closest('[data-action]');
      if(!t) return;
      if(t.dataset.action==='switch-login'){ state.authMode='login'; state.authMsg=null; render(); }
      if(t.dataset.action==='switch-signup'){ state.authMode='signup'; state.authMsg=null; render(); }
    });
  }

  async function onAuthSubmit(ev){
    ev.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    state.authLoading = true; state.authMsg = null; render();

    if(state.authMode==='signup'){
      const {data, error} = await sb.auth.signUp({email, password});
      state.authLoading = false;
      if(error){ state.authMsg = {type:'error', text: error.message}; render(); return; }
      if(data.session){
        state.session = data.session;
        loadAll();
      } else {
        state.authMsg = {type:'ok', text:'Cuenta creada. Revisa tu correo para confirmar tu cuenta y luego inicia sesión.'};
        state.authMode = 'login';
        render();
      }
    } else {
      const {data, error} = await sb.auth.signInWithPassword({email, password});
      state.authLoading = false;
      if(error){ state.authMsg = {type:'error', text: error.message==='Invalid login credentials' ? 'Correo o contraseña incorrectos.' : error.message}; render(); return; }
      state.session = data.session;
      loadAll();
    }
  }

  function renderSidebar(){
    const filtered = state.students.filter(s=>{
      const q = state.search.trim().toLowerCase();
      if(!q) return true;
      return s.nombre.toLowerCase().includes(q) || (s.diagnostico||'').toLowerCase().includes(q);
    }).sort((a,b)=> a.nombre.localeCompare(b.nombre,'es'));

    return `<div class="sidebar">
      <div class="sidebar-head">
        <input class="search-input" id="searchInput" type="text" placeholder="Buscar estudiante o diagnóstico…" value="${esc(state.search)}">
        <button class="add-student-btn" data-action="toggle-add-student">+ Agregar estudiante</button>
        ${pendingSeedCount()>0 ? `<button class="add-student-btn" style="margin-top:8px;background:var(--gold);" data-action="import-seed">Importar lista (${pendingSeedCount()})</button>` : ''}
      </div>
      ${state.showAddStudent ? renderStudentForm(null) : ''}
      <div class="student-list">
        ${filtered.length ? filtered.map(s=>{
          const es = studentEntries(s.id);
          const active = s.id===state.selectedId;
          const priority = hasRecentPriority(s.id);
          return `<div class="student-tab ${active?'active':''} ${priority?'priority':''}" data-action="select-student" data-id="${s.id}">
            <div class="row1">
              <span class="name">${esc(s.nombre)}</span>
              <span class="count-badge">${es.length}</span>
            </div>
            <span class="meta">${s.edad?s.edad+' años · ':''}${esc(s.grado||'')}</span>
            <span class="diag">${esc(s.diagnostico||'Sin diagnóstico registrado')}</span>
          </div>`;
        }).join('') : `<div class="empty-list">${state.students.length? 'Sin resultados para tu búsqueda.' : 'Aún no has agregado estudiantes. Usa "Agregar estudiante" arriba.'}</div>`}
      </div>
    </div>`;
  }

  function renderStudentForm(editing){
    const s = editing || {nombre:'',edad:'',grado:'',diagnostico:''};
    return `<div class="student-form">
      <label class="field-label">Nombre</label>
      <input class="field-input" id="f-nombre" type="text" value="${esc(s.nombre)}" placeholder="Nombre del estudiante">
      <div class="field-row">
        <div>
          <label class="field-label">Edad</label>
          <input class="field-input" id="f-edad" type="number" min="4" max="21" value="${esc(String(s.edad||''))}" placeholder="Ej. 9">
        </div>
        <div>
          <label class="field-label">Grado</label>
          <input class="field-input" id="f-grado" type="text" value="${esc(s.grado||'')}" placeholder="Ej. 3ro">
        </div>
      </div>
      <label class="field-label">Diagnóstico</label>
      <input class="field-input" id="f-diagnostico" type="text" value="${esc(s.diagnostico||'')}" placeholder="Ej. TDAH, Dislexia…">
      <div class="form-actions">
        <button class="btn btn-primary" data-action="save-student" data-id="${editing?editing.id:''}" ${state.busy?'disabled':''}>${editing?'Guardar cambios':'Agregar'}</button>
        <button class="btn btn-ghost" data-action="cancel-student-form">Cancelar</button>
      </div>
    </div>`;
  }

  function renderEmptyState(){
    return `<div class="empty-state">
      <h2>Selecciona un estudiante</h2>
      <p>Elige un estudiante de la lista o agrega uno nuevo para empezar a registrar preocupaciones de padres, maestros y observaciones propias.</p>
    </div>`;
  }

  function renderProfile(s){
    if(state.editingStudent && state.editingStudent.id===s.id){
      return `<div class="profile-card">${renderStudentForm(state.editingStudent)}</div>`;
    }

    const entries = studentEntries(s.id);
    const filtered = state.categoryFilter==='todas' ? entries : entries.filter(e=>e.categoria===state.categoryFilter);

    return `<div class="profile-card">
      <div class="profile-top">
        <div>
          <div class="profile-name">${esc(s.nombre)}</div>
          <div class="profile-meta-row">
            ${s.edad?`<span class="meta-chip">${s.edad} años</span>`:''}
            ${s.grado?`<span class="meta-chip">${esc(s.grado)}</span>`:''}
            <span class="meta-chip">${entries.length} entrada${entries.length===1?'':'s'}</span>
          </div>
          ${s.diagnostico ? `<div class="profile-diag"><strong>Diagnóstico:</strong> ${esc(s.diagnostico)}</div>` : ''}
        </div>
        <div class="profile-actions">
          <button class="btn btn-ghost btn-small" data-action="edit-student" data-id="${s.id}">Editar</button>
          ${state.confirmDeleteStudent===s.id
            ? `<span class="confirm-row">¿Eliminar estudiante y su historial?
                 <button class="btn btn-danger btn-small" data-action="confirm-delete-student" data-id="${s.id}">Sí</button>
                 <button class="btn btn-ghost btn-small" data-action="cancel-delete-student">No</button></span>`
            : `<button class="btn btn-ghost btn-small" data-action="ask-delete-student" data-id="${s.id}">Eliminar</button>`}
        </div>
      </div>
    </div>

    <div class="section-head">
      <h3>Nueva entrada</h3>
      <button class="btn btn-primary btn-small" data-action="toggle-add-entry">${state.showAddEntry?'Cerrar':'+ Registrar preocupación'}</button>
    </div>
    ${state.showAddEntry ? renderEntryForm(s.id) : ''}

    <div class="section-head">
      <h3>Historial</h3>
      <div class="filter-chips">
        <span class="chip ${state.categoryFilter==='todas'?'active':''}" data-action="filter-cat" data-cat="todas">Todas</span>
        ${CATEGORIES.map(c=>`<span class="chip ${state.categoryFilter===c.id?'active':''}" data-action="filter-cat" data-cat="${c.id}">${c.label}</span>`).join('')}
      </div>
    </div>
    <div class="timeline">
      ${filtered.length ? filtered.map(e=>renderEntry(s.id,e)).join('') : `<div class="empty-timeline">Sin entradas${state.categoryFilter!=='todas'?' en esta categoría':' todavía'}. Registra la primera preocupación con el botón de arriba.</div>`}
    </div>`;
  }

  function renderEntryForm(studentId){
    const today = new Date().toISOString().slice(0,10);
    return `<div class="entry-form">
      <h4>Registrar nueva preocupación o comunicación</h4>
      <div class="field-row">
        <div>
          <label class="field-label">Fecha</label>
          <input class="field-input" id="e-fecha" type="date" value="${today}">
        </div>
        <div>
          <label class="field-label">Fuente</label>
          <select class="field-select" id="e-fuente">
            ${SOURCES.map(f=>`<option value="${f}">${f}</option>`).join('')}
          </select>
        </div>
      </div>
      <label class="field-label">Categoría</label>
      <select class="field-select" id="e-categoria">
        ${CATEGORIES.map(c=>`<option value="${c.id}">${c.label}</option>`).join('')}
      </select>
      <label class="field-label">Detalle</label>
      <textarea class="field-textarea" id="e-texto" placeholder="Ej. La mamá escribió preocupada porque el niño no está terminando de escribir en clase…"></textarea>
      <label class="priority-toggle"><input type="checkbox" id="e-prioridad"> Marcar como prioridad alta</label>
      <div class="form-actions">
        <button class="btn btn-primary" data-action="save-entry" data-id="${studentId}" ${state.busy?'disabled':''}>Guardar entrada</button>
        <button class="btn btn-ghost" data-action="toggle-add-entry">Cancelar</button>
      </div>
    </div>`;
  }

  function renderEntry(studentId, e){
    return `<div class="entry-card cat-${e.categoria}">
      <div class="entry-top">
        <div class="entry-tags">
          <span class="entry-date">${fmtDate(e.fecha)}</span>
          <span class="entry-source">${esc(e.fuente)}</span>
          ${e.prioridad?'<span class="priority-flag">Prioridad alta</span>':''}
        </div>
      </div>
      <div class="entry-text">${esc(e.texto)}</div>
      <div class="entry-bottom">
        <span class="entry-category-label">${catLabel(e.categoria)}</span>
        ${state.confirmDeleteEntry===e.id
          ? `<span class="confirm-row">¿Eliminar?
               <button class="entry-delete" data-action="confirm-delete-entry" data-sid="${studentId}" data-eid="${e.id}" style="color:var(--alert);font-weight:700;">Sí</button>
               <button class="entry-delete" data-action="cancel-delete-entry">No</button></span>`
          : `<button class="entry-delete" data-action="ask-delete-entry" data-eid="${e.id}">Eliminar</button>`}
      </div>
    </div>`;
  }

  function attachHandlers(){
    const root = document.getElementById('root');
    const searchEl = document.getElementById('searchInput');
    if(searchEl){
      searchEl.addEventListener('input', (ev)=>{ state.search = ev.target.value; render(); });
      searchEl.focus();
      const val = searchEl.value; searchEl.value=''; searchEl.value = val;
    }
    root.addEventListener('click', onClick);
  }

  async function onClick(ev){
    const t = ev.target.closest('[data-action]');
    if(!t) return;
    const action = t.dataset.action;

    if(action==='logout'){
      await sb.auth.signOut();
      state.session = null; state.loaded = false;
      state.students = []; state.entriesByStudent = {}; state.selectedId = null;
      render();
    }
    else if(action==='export-data'){
      downloadExport();
    }
    else if(action==='toggle-add-student'){
      state.showAddStudent = !state.showAddStudent;
      state.editingStudent = null;
      render();
    }
    else if(action==='cancel-student-form'){
      state.showAddStudent = false;
      state.editingStudent = null;
      render();
    }
    else if(action==='save-student'){
      const nombre = document.getElementById('f-nombre').value.trim();
      const edad = document.getElementById('f-edad').value.trim();
      const grado = document.getElementById('f-grado').value.trim();
      const diagnostico = document.getElementById('f-diagnostico').value.trim();
      if(!nombre) return;
      const id = t.dataset.id;
      state.busy = true; render();
      if(id){
        await updateStudent(id, {nombre, edad, grado, diagnostico});
        state.editingStudent = null;
      } else {
        await addStudent({nombre, edad, grado, diagnostico});
        state.showAddStudent = false;
        const created = state.students.find(s=>s.nombre===nombre);
        if(created) state.selectedId = created.id;
      }
      state.busy = false;
      render();
    }
    else if(action==='import-seed'){
      const existing = new Set(state.students.map(s=>s.nombre.trim().toLowerCase()));
      const toAdd = SEED_STUDENTS.filter(s=>!existing.has(s.nombre.trim().toLowerCase()))
        .map(s=>({nombre:s.nombre, grado:s.grado, edad:'', diagnostico:''}));
      if(toAdd.length){
        state.busy = true; render();
        const {data, error} = await sb.from('students').insert(toAdd).select();
        if(!error && data){
          data.forEach(row=>{
            state.students.push(row);
            state.entriesByStudent[row.id] = [];
          });
        } else if(error){ console.error(error); }
        state.busy = false;
      }
      render();
    }
    else if(action==='select-student'){
      state.selectedId = t.dataset.id;
      state.showAddEntry = false;
      state.categoryFilter = 'todas';
      state.confirmDeleteEntry = null;
      state.confirmDeleteStudent = null;
      render();
    }
    else if(action==='back'){
      state.selectedId = null;
      render();
    }
    else if(action==='edit-student'){
      state.editingStudent = state.students.find(s=>s.id===t.dataset.id);
      render();
    }
    else if(action==='ask-delete-student'){
      state.confirmDeleteStudent = t.dataset.id;
      render();
    }
    else if(action==='cancel-delete-student'){
      state.confirmDeleteStudent = null;
      render();
    }
    else if(action==='confirm-delete-student'){
      const id = t.dataset.id;
      state.busy = true; render();
      await deleteStudentRow(id);
      state.confirmDeleteStudent = null;
      if(state.selectedId===id) state.selectedId = null;
      state.busy = false;
      render();
    }
    else if(action==='toggle-add-entry'){
      state.showAddEntry = !state.showAddEntry;
      render();
    }
    else if(action==='save-entry'){
      const sid = t.dataset.id;
      const fecha = document.getElementById('e-fecha').value;
      const fuente = document.getElementById('e-fuente').value;
      const categoria = document.getElementById('e-categoria').value;
      const texto = document.getElementById('e-texto').value.trim();
      const prioridad = document.getElementById('e-prioridad').checked;
      if(!texto || !fecha) return;
      state.busy = true; render();
      await addEntry(sid, {fecha, fuente, categoria, prioridad, texto});
      state.showAddEntry = false;
      state.busy = false;
      render();
    }
    else if(action==='filter-cat'){
      state.categoryFilter = t.dataset.cat;
      render();
    }
    else if(action==='ask-delete-entry'){
      state.confirmDeleteEntry = t.dataset.eid;
      render();
    }
    else if(action==='cancel-delete-entry'){
      state.confirmDeleteEntry = null;
      render();
    }
    else if(action==='confirm-delete-entry'){
      const sid = t.dataset.sid, eid = t.dataset.eid;
      state.busy = true; render();
      await deleteEntryRow(sid, eid);
      state.confirmDeleteEntry = null;
      state.busy = false;
      render();
    }
  }

  // ============ INIT ============
  async function init(){
    const {data} = await sb.auth.getSession();
    state.session = data.session || null;
    if(state.session){
      loadAll();
    } else {
      render();
    }
    sb.auth.onAuthStateChange((event, session)=>{
      if(event==='SIGNED_OUT'){
        state.session = null; state.loaded = false;
        state.students = []; state.entriesByStudent = {}; state.selectedId = null;
        render();
      }
    });
  }

  init();
})();
</script>
</body>
</html>
